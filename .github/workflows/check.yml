name: VPN Gate Node Check

on:
  # 定时自动更新：每 2 小时一次
  # （原版仓库没有定时器，README 宣称的「30 分钟自动更新」实际不存在，这里补上）
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Pages checker + build page
        run: python vpngate.py
        env:
          # 自建检测服务（CheckSocks5 部署在 Cloudflare Pages 上）
          CHECK_WORKER: "https://sstp-check-pages.pages.dev/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "24"
          CHECK_TIMEOUT: "90"
          NODES_URL: "https://wcxbaby.github.io/gate/nodes.txt"
          # 优选入口按运营商分线路：公司用联通，家里用移动
          # 生成的 nodes.txt 中，节点备注会带「联通-」「移动-」前缀以便区分
          OPTIMAL_API_CU: "https://cf.090227.xyz/cu?ips=8&port=443"
          OPTIMAL_API_CMCC: "https://cf.090227.xyz/cmcc?ips=8&port=443"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://wcxbaby.github.io/gate/ (outcome: ${{ steps.deployment.outcome }})"'
